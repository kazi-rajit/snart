    #initial-loader {
      position: fixed; inset: 0; z-index: 9999;

    #initial-loader.hide { opacity: 0; pointer-events: none; }
    #initial-loader-spinner {

    @keyframes itl-spin { to { transform: rotate(360deg); } }

      window.__perfHtmlParsed = performance.now();

    <script>
      window.__hideInitialLoader = function () {
        var el = document.getElementById('initial-loader');
        if (!el) return;
        el.classList.add('hide');
        setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 200);
      };
      // Safety timeout — never let the initial loader stay visible longer than 2.5s
      setTimeout(function () { window.__hideInitialLoader && window.__hideInitialLoader(); }, 2500);
    </script>
